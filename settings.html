<div class="bb-memory-settings" id="bb_memory_root">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>BB-Memory</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">

            <!-- 启用开关 -->
            <label class="checkbox_label" style="margin: 8px 0;">
                <input id="bb_memory_enabled" type="checkbox" checked />
                <span>启用 BB-Memory</span>
            </label>

            <!-- 记忆数量 -->
            <div class="bb-mem-sidebar-info">
                当前聊天记忆数：<strong id="bb_memory_count">0</strong>
            </div>

            <!-- 快捷按钮 -->
            <div class="bb-mem-sidebar-buttons">
                <button id="bb_memory_add_btn" class="menu_button" title="添加一条新记忆">
                    <i class="fa-solid fa-plus"></i> 添加记忆
                </button>
                <button id="bb_memory_manage_btn" class="menu_button" title="打开记忆管理面板">
                    <i class="fa-solid fa-list"></i> 管理记忆
                </button>
            </div>

            <hr />

            <!-- 注入设置 -->
            <div class="bb-mem-sidebar-section">
                <label for="bb_memory_depth">
                    注入深度
                    <small class="bb-mem-hint">
                        记忆插入到聊天历史中的位置（0 = 最末尾）
                    </small>
                </label>
                <input id="bb_memory_depth" type="number" class="text_pole"
                       min="0" max="100" value="4" />
            </div>

            <div class="bb-mem-sidebar-section">
                <label for="bb_memory_max_results">
                    最大检索数
                    <small class="bb-mem-hint">
                        每次生成时最多注入多少条相关记忆
                    </small>
                </label>
                <input id="bb_memory_max_results" type="number" class="text_pole"
                       min="1" max="20" value="5" />
            </div>

            <div class="bb-mem-sidebar-section">
                <label for="bb_memory_template">
                    注入模板
                    <small class="bb-mem-hint">
                        用 {{memories}} 代表记忆内容
                    </small>
                </label>
                <textarea id="bb_memory_template" class="text_pole bb-mem-textarea" rows="3">[角色记忆]
{{memories}}</textarea>
            </div>

        </div>
    </div>
</div>
