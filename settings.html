<div class="bb-memory-settings" id="bb_memory_root">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>BB-Memory v5.9.5</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">

            <label class="checkbox_label" style="margin: 8px 0;">
                <input id="bb_memory_enabled" type="checkbox" checked />
                <span>启用 BB-Memory</span>
            </label>

            <div class="bb-mem-sidebar-info">
                当前记忆数：<strong id="bb_memory_count">0</strong>
            </div>

            <!-- v5.3: 提取进度 -->
            <div class="bb-mem-sidebar-info" id="bb_sidebar_extract_progress" style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">
                <i class="fa-solid fa-moon" style="font-size:0.85em;opacity:0.6;"></i>
                <span style="font-size:0.85em;">提取状态: <strong>空闲</strong></span>
            </div>

            <!-- 快捷按钮 行1：核心操作 -->
            <div class="bb-mem-sidebar-buttons">
                <button id="bb_init_memory_btn" class="menu_button" title="从角色卡+世界书+对话初始化记忆">
                    <i class="fa-solid fa-rocket"></i> 初始化记忆
                </button>
                <button id="bb_memory_manage_btn" class="menu_button" title="打开记忆管家（增删改查/存档槽/常驻档案）">
                    <i class="fa-solid fa-list"></i> 记忆管家
                </button>
                <button id="bb_memory_maintenance_btn" class="menu_button" title="打开记忆维护面板（等级/状态管理）">
                    <i class="fa-solid fa-broom"></i> 记忆维护
                </button>
            </div>

            <!-- 快捷按钮 行2：辅助操作 -->
            <div class="bb-mem-sidebar-buttons">
                <button id="bb_memory_extract_btn" class="menu_button" title="手动触发AI提取记忆">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> 手动提取
                </button>
                <button id="bb_memory_meta_btn" class="menu_button" title="标记/取消最后一条AI消息为元指令">
                    <i class="fa-solid fa-tag"></i> 标记消息
                </button>
                <button id="bb_memory_toggle_vis_btn" class="menu_button" title="显示/隐藏已提取的聊天楼层">
                    <i class="fa-solid fa-eye-slash"></i> 楼层可见
                </button>
            </div>

            <!-- 跨设备备份 -->
            <div style="display:flex;gap:4px;margin:4px 0;">
                <button id="bb_memory_backup_now" class="menu_button" title="立即备份到服务器" style="flex:1;font-size:0.8em;">
                    <i class="fa-solid fa-cloud-upload"></i> 备份
                </button>
                <button id="bb_memory_restore_now" class="menu_button" title="从服务器恢复备份" style="flex:1;font-size:0.8em;">
                    <i class="fa-solid fa-cloud-download"></i> 恢复
                </button>
            </div>

            <!-- 命中记忆 -->
            <div class="bb-settings-section">
                <div class="bb-settings-section-header" data-section="hits">
                    <span><i class="fa-solid fa-bullseye"></i> 命中记忆 <small id="bb_hit_timestamp" style="font-size:0.7em;opacity:0.5;margin-left:6px;"></small></span>
                    <span class="bb-settings-chevron"><i class="fa-solid fa-chevron-down"></i></span>
                </div>
                <div class="bb-settings-section-body">
                    <div id="bb_sidebar_hit_list" style="max-height:240px;overflow-y:auto;">
                        <div style="opacity:0.4;text-align:center;font-size:0.8em;">等待检索...</div>
                    </div>
                </div>
            </div>

            <hr />

            <!-- 注入设置 -->
            <div class="bb-settings-section">
                <div class="bb-settings-section-header" data-section="injection">
                    <span><i class="fa-solid fa-syringe"></i> 注入设置</span>
                    <span class="bb-settings-chevron"><i class="fa-solid fa-chevron-down"></i></span>
                </div>
                <div class="bb-settings-section-body">

                    <div class="bb-mem-sidebar-section">
                        <label for="bb_max_results">最大检索数</label>
                        <input id="bb_max_results" type="number" class="text_pole" min="1" max="30" value="10" />
                    </div>

                    <div class="bb-mem-sidebar-section">
                        <label for="bb_token_budget">Token 预算</label>
                        <input id="bb_token_budget" type="number" class="text_pole" min="100" max="4000" step="50" value="800" />
                    </div>

                    <div class="bb-mem-sidebar-section">
                        <label for="bb_injection_template">注入模板 <small>用 {{memories}} 代表记忆内容</small></label>
                        <textarea id="bb_injection_template" class="text_pole bb-mem-textarea" rows="2">[BB-Memory 长期记忆]
{{memories}}</textarea>
                    </div>

                </div>
            </div>

            <hr />

            <!-- 升降格与维护设置 -->
            <div class="bb-settings-section">
                <div class="bb-settings-section-header" data-section="tier">
                    <span><i class="fa-solid fa-layer-group"></i> 升降格与维护</span>
                    <span class="bb-settings-chevron"><i class="fa-solid fa-chevron-down"></i></span>
                </div>
                <div class="bb-settings-section-body">

                    <div class="bb-mem-sidebar-section">
                        <label for="bb_maintenance_mem_threshold">记忆维护阈值</label>
                        <small class="bb-mem-hint">记忆数超过此值时提示维护（默认20）</small>
                        <input id="bb_maintenance_mem_threshold" type="number" class="text_pole" min="5" max="200" value="20" />
                    </div>

                    <div class="bb-mem-sidebar-section">
                        <label for="bb_maintenance_npc_threshold">NPC 维护阈值</label>
                        <small class="bb-mem-hint">NPC数超过此值时提示维护（默认5）</small>
                        <input id="bb_maintenance_npc_threshold" type="number" class="text_pole" min="2" max="50" value="5" />
                    </div>

                    <div class="bb-mem-sidebar-section">
                        <label for="bb_maintenance_item_threshold">物品维护阈值</label>
                        <small class="bb-mem-hint">物品数超过此值时提示维护（默认20）</small>
                        <input id="bb_maintenance_item_threshold" type="number" class="text_pole" min="5" max="200" value="20" />
                    </div>

                    <div class="bb-mem-sidebar-section">
                        <label for="bb_diversity_limit">多样性限制</label>
                        <small class="bb-mem-hint">同一标签最多允许多少条核心记忆（默认5）</small>
                        <input id="bb_diversity_limit" type="number" class="text_pole" min="2" max="20" value="5" />
                    </div>

                    <label class="checkbox_label" style="margin: 8px 0;">
                        <input id="bb_timeline_summary_enabled" type="checkbox" checked />
                        <span>启用时间线总结</span>
                    </label>

                    <label class="checkbox_label" style="margin: 8px 0;">
                        <input id="bb_auto_backup_enabled" type="checkbox" />
                        <span>启用自动备份（跨设备同步）</span>
                    </label>

                </div>
            </div>

            <hr />

            <!-- AI 自动生成设置 -->
            <div class="bb-settings-section">
                <div class="bb-settings-section-header" data-section="autogen">
                    <span><i class="fa-solid fa-robot"></i> AI 自动提取</span>
                    <span class="bb-settings-chevron"><i class="fa-solid fa-chevron-down"></i></span>
                </div>
                <div class="bb-settings-section-body">

                    <label class="checkbox_label" style="margin: 8px 0;">
                        <input id="bb_auto_gen_enabled" type="checkbox" />
                        <span>启用 AI 自动提取</span>
                    </label>

                    <label class="checkbox_label" style="margin: 8px 0;">
                        <input id="bb_debug_logging" type="checkbox" />
                        <span>调试日志</span>
                    </label>

                    <div class="bb-mem-sidebar-section">
                        <label for="bb_auto_gen_mode">API 模式</label>
                        <select id="bb_auto_gen_mode" class="text_pole">
                            <option value="main">主 API</option>
                            <option value="custom">自定义 API</option>
                        </select>
                    </div>

                    <div class="bb-mem-sidebar-section">
                        <label for="bb_extraction_confirm_mode">提取确认模式</label>
                        <select id="bb_extraction_confirm_mode" class="text_pole">
                            <option value="active">主动确认</option>
                            <option value="semi" selected>半自动</option>
                            <option value="auto">全自动</option>
                        </select>
                    </div>

                    <div class="bb-mem-sidebar-section">
                        <label for="bb_active_confirm_style">确认通知方式</label>
                        <select id="bb_active_confirm_style" class="text_pole">
                            <option value="popup" selected>浮动弹窗</option>
                            <option value="toast">通知提示</option>
                        </select>
                    </div>

                    <div class="bb-mem-sidebar-section">
                        <label for="bb_context_window">上下文保留窗口（Exchange数）</label>
                        <input id="bb_context_window" type="number" class="text_pole" min="1" max="20" value="3" />
                    </div>
                    <div class="bb-mem-hint">保留最近N个AI回复在上下文中，超出窗口的将被提取并隐藏。</div>

                    <div id="bb_memory_custom_api_section">
                        <div class="bb-mem-sidebar-section">
                            <label for="bb_auto_gen_endpoint">自定义 API 端点</label>
                            <input id="bb_auto_gen_endpoint" type="text" class="text_pole" placeholder="https://api.example.com" />
                        </div>
                        <div class="bb-mem-sidebar-section">
                            <label for="bb_auto_gen_api_key">API Key</label>
                            <input id="bb_auto_gen_api_key" type="password" class="text_pole" placeholder="sk-..." />
                        </div>
                        <div class="bb-mem-sidebar-section">
                            <label for="bb_auto_gen_model">模型</label>
                            <input id="bb_auto_gen_model" type="text" class="text_pole" placeholder="gpt-4o-mini" />
                        </div>
                    </div>

                </div>
            </div>

            <hr />

            <!-- 语义向量设置 -->
            <div class="bb-settings-section">
                <div class="bb-settings-section-header" data-section="embedding">
                    <span><i class="fa-solid fa-vector-square"></i> 语义向量</span>
                    <span class="bb-settings-chevron"><i class="fa-solid fa-chevron-down"></i></span>
                </div>
                <div class="bb-settings-section-body">

                    <label class="checkbox_label" style="margin: 8px 0;">
                        <input id="bb_embedding_enabled" type="checkbox" />
                        <span>启用语义向量检索</span>
                    </label>

                    <div class="bb-mem-sidebar-section">
                        <label for="bb_embedding_endpoint">Embedding API 端点</label>
                        <input id="bb_embedding_endpoint" type="text" class="text_pole" placeholder="https://api.example.com" />
                    </div>
                    <div class="bb-mem-sidebar-section">
                        <label for="bb_embedding_api_key">API Key</label>
                        <input id="bb_embedding_api_key" type="password" class="text_pole" />
                    </div>
                    <div class="bb-mem-sidebar-section">
                        <label for="bb_embedding_model">模型</label>
                        <input id="bb_embedding_model" type="text" class="text_pole" placeholder="text-embedding-3-small" />
                    </div>
                    <button id="bb_embedding_reindex_btn" class="menu_button" style="margin-top:8px;">
                        <i class="fa-solid fa-rotate"></i> 重建语义索引
                    </button>

                </div>
            </div>

            <hr />

            <!-- 故事日历 & 去重 -->
            <div class="bb-settings-section">
                <div class="bb-settings-section-header" data-section="calendar">
                    <span><i class="fa-solid fa-calendar-days"></i> 故事日历</span>
                    <span class="bb-settings-chevron"><i class="fa-solid fa-chevron-down"></i></span>
                </div>
                <div class="bb-settings-section-body">
                    <div class="bb-mem-sidebar-section">
                        <label for="bb_calendar_description">日历描述 <small>描述你的奇幻世界日历规则</small></label>
                        <textarea id="bb_calendar_description" class="text_pole" rows="2" placeholder="留空使用默认时间推断..."></textarea>
                    </div>

                    <label class="checkbox_label" style="margin: 8px 0;">
                        <input id="bb_dedup_enabled" type="checkbox" checked />
                        <span>启用语义去重</span>
                    </label>
                    <label class="checkbox_label" style="margin: 8px 0;">
                        <input id="bb_cluster_enabled" type="checkbox" checked />
                        <span>启用标签聚类</span>
                    </label>
                </div>
            </div>

            <hr />

            <!-- 世界书导入 -->
            <div class="bb-settings-section">
                <div class="bb-settings-section-header" data-section="worldbook">
                    <span><i class="fa-solid fa-book-atlas"></i> 世界书导入</span>
                    <span class="bb-settings-chevron"><i class="fa-solid fa-chevron-down"></i></span>
                </div>
                <div class="bb-settings-section-body">
                    <div class="bb-mem-sidebar-buttons">
                        <button id="bb_memory_import_wb_btn" class="menu_button" title="从世界书JSON文件逐条导入">
                            <i class="fa-solid fa-file-import"></i> 直接导入
                        </button>
                        <button id="bb_memory_import_wb_ai_btn" class="menu_button" title="AI整理后导入">
                            <i class="fa-solid fa-robot"></i> AI 摘要导入
                        </button>
                    </div>
                </div>
            </div>

            <!-- 测试功能 -->
            <hr />
            <div class="bb-settings-section">
                <div class="bb-settings-section-header" data-section="experimental">
                    <span><i class="fa-solid fa-flask"></i> 测试功能</span>
                    <span class="bb-settings-chevron"><i class="fa-solid fa-chevron-down"></i></span>
                </div>
                <div class="bb-settings-section-body">
                    <div class="bb-mem-sidebar-section">
                        <label for="bb_extraction_mode">提取模式</label>
                        <select id="bb_extraction_mode" class="text_pole">
                            <option value="staged">分阶段提取（默认）</option>
                            <option value="merged">合并提取（省Token，测试中）</option>
                        </select>
                    </div>
                    <div class="bb-mem-hint">合并模式将4次API调用合并为1次，降低Token消耗。</div>
                </div>
            </div>

        </div>
    </div>
</div>
