<div class="smart-memory-settings" id="smart_memory_settings_root">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Smart Memory</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">

            <!-- Quick Status -->
            <div id="smart_memory_status" class="smart-memory-status smart-memory-status--idle">
                <span class="smart-memory-status-dot"></span>
                <span class="smart-memory-status-text">空闲</span>
            </div>

            <!-- Enable Toggle -->
            <label class="checkbox_label" style="margin: 8px 0;">
                <input id="smart_memory_enabled" type="checkbox" checked />
                <span>启用 Smart Memory</span>
            </label>

            <!-- Quick Stats -->
            <div class="sm-sidebar-card">
                <div class="sm-sidebar-stats">
                    <div class="sm-sidebar-stat">
                        <span>记忆:</span>
                        <span class="sm-sidebar-stat-value" id="smart_memory_sidebar_total">0</span>
                    </div>
                    <div class="sm-sidebar-stat">
                        <span>长期:</span>
                        <span class="sm-sidebar-stat-value" id="smart_memory_sidebar_ltm">0</span>
                    </div>
                    <div class="sm-sidebar-stat">
                        <span>短期:</span>
                        <span class="sm-sidebar-stat-value" id="smart_memory_sidebar_stm">0</span>
                    </div>
                    <div class="sm-sidebar-stat">
                        <span>固定:</span>
                        <span class="sm-sidebar-stat-value" id="smart_memory_sidebar_pinned">0</span>
                    </div>
                </div>
            </div>

            <!-- Open Popup Button -->
            <button id="smart_memory_open_popup" class="menu_button sm-open-popup-btn">
                <i class="fa-solid fa-gear"></i> 打开管理面板
            </button>

        </div>
    </div>
</div>
